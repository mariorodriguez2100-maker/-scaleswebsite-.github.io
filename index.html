<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Guitar Scale Mastery Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
            50% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.8); }
        .animate-glow { animation: pulse-glow 2s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 font-sans transition-colors duration-300">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header with Language Toggle -->
        <header class="flex flex-col md:flex-row justify-between items-center border-b border-slate-800 pb-4 gap-4">
            <div>
                <h1 id="txt-title" class="text-2xl font-black tracking-wider text-cyan-400 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">GUITAR SCALE MASTERY STUDIO</h1>
                <p id="txt-subtitle" class="text-sm text-slate-400">Interactive Slide Rule, Fretboard & Practice Suite</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleLang()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 rounded-lg text-sm font-bold border border-slate-700 transition-all transform hover:scale-105 active:scale-95 shadow-lg">
                    🌐 <span id="lang-btn-text">Español</span>
                </button>
            </div>
        </header>

        <!-- Slide Rule Controls -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-900/90 p-6 rounded-2xl border border-slate-800 shadow-2xl backdrop-blur-md">
            <div>
                <label id="lbl-root" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Root Note</label>
                <div id="root-notes" class="flex flex-wrap gap-1.5"></div>
            </div>
            <div>
                <label id="lbl-scale" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Scale / Mode</label>
                <select id="scale-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-cyan-500 transition-all font-semibold"></select>
            </div>
            <div>
                <label id="lbl-view" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Fretboard Overlay</label>
                <select id="overlay-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-cyan-500 transition-all font-semibold">
                    <option value="all" id="opt-all">All Scale Notes</option>
                    <option value="root" id="opt-root">Roots Only</option>
                    <option value="pentatonic" id="opt-penta">Pentatonic Box</option>
                </select>
            </div>
        </div>

        <!-- Theory Info Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-900/90 p-6 rounded-2xl border border-slate-800 transition-all hover:border-cyan-500/50 shadow-xl">
                <h2 id="hdr-notes" class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-3">Scale Notes</h2>
                <div id="scale-notes" class="text-lg font-mono font-bold tracking-widest text-slate-100 flex flex-wrap gap-2"></div>
            </div>
            <div class="bg-slate-900/90 p-6 rounded-2xl border border-slate-800 transition-all hover:border-cyan-500/50 shadow-xl">
                <h2 id="hdr-intervals" class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-3">Intervals</h2>
                <div id="scale-intervals" class="text-xs font-mono text-slate-300 flex flex-wrap gap-1.5"></div>
            </div>
            <div class="bg-slate-900/90 p-6 rounded-2xl border border-slate-800 transition-all hover:border-cyan-500/50 shadow-xl">
                <h2 id="hdr-chords" class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-3">Diatonic Chords</h2>
                <div id="diatonic-chords" class="text-xs font-mono text-slate-300 grid grid-cols-2 gap-2"></div>
            </div>
        </div>

        <!-- Interactive Fretboard -->
        <div class="bg-slate-900/90 p-6 rounded-2xl border border-slate-800 overflow-x-auto shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 id="hdr-fretboard" class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Interactive Fretboard (E-A-D-G-B-E)</h2>
                <button onclick="playScaleAudio()" id="btn-play" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl text-xs uppercase tracking-wider transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-cyan-500/30">
                    🔊 Play Scale
                </button>
            </div>
            <div id="fretboard" class="min-w-[850px] space-y-3 py-2"></div>
        </div>

        <!-- Footer Disclaimer & Credits -->
        <footer class="text-center py-6 border-t border-slate-800 text-xs text-slate-500 space-y-1">
            <p id="txt-disclaimer">Free website for everyone / Sitio web gratuito para todos</p>
            <p class="font-semibold text-slate-400">Created by Mario</p>
        </footer>
    </div>

    <script>
        const translations = {
            en: {
                title: "GUITAR SCALE MASTERY STUDIO",
                subtitle: "Interactive Slide Rule, Fretboard & Practice Suite",
                langBtn: "Español",
                root: "Root Note",
                scale: "Scale / Mode",
                view: "Fretboard Overlay",
                optAll: "All Scale Notes",
                optRoot: "Roots Only",
                optPenta: "Pentatonic Box",
                hdrNotes: "Scale Notes",
                hdrIntervals: "Intervals",
                hdrChords: "Diatonic Chords",
                hdrFretboard: "Interactive Fretboard (E-A-D-G-B-E)",
                btnPlay: "🔊 Play Scale",
                disclaimer: "Free website for everyone"
            },
            es: {
                title: "ESTUDIO DE DOMINIO DE ESCALAS",
                subtitle: "Regla de cálculo interactiva, diapasón y práctica",
                langBtn: "English",
                root: "Nota Raíz",
                scale: "Escala / Modo",
                view: "Vista del Diapasón",
                optAll: "Todas las notas",
                optRoot: "Solo Raíces",
                optPenta: "Caja Pentatónica",
                hdrNotes: "Notas de la Escala",
                hdrIntervals: "Intervalos",
                hdrChords: "Acordes Diatónicos",
                hdrFretboard: "Diapasón Interactivo (E-A-D-G-B-E)",
                btnPlay: "🔊 Reproducir Escala",
                disclaimer: "Sitio web gratuito para todos"
            }
        };

        let currentLang = 'en';
        const notesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const scales = {
            "Major (Ionian)": { intervals: [0, 2, 4, 5, 7, 9, 11], chords: ["Maj", "min", "min", "Maj", "Maj", "min", "dim"] },
            "Natural Minor (Aeolian)": { intervals: [0, 2, 3, 5, 7, 8, 10], chords: ["min", "dim", "Maj", "min", "min", "Maj", "Maj"] },
            "Pentatonic Major": { intervals: [0, 2, 4, 7, 9], chords: [] },
            "Pentatonic Minor": { intervals: [0, 3, 5, 7, 10], chords: [] },
            "Blues": { intervals: [0, 3, 5, 6, 7, 10], chords: [] },
            "Dorian": { intervals: [0, 2, 3, 5, 7, 9, 10], chords: ["min", "min", "Maj", "Maj", "min", "dim", "Maj"] },
            "Mixolydian": { intervals: [0, 2, 4, 5, 7, 9, 10], chords: ["Maj", "min", "dim", "Maj", "min", "min", "Maj"] }
        };
        const intervalNames = {0: "R", 1: "b2", 2: "2", 3: "b3", 4: "3", 5: "4", 6: "b5/#4", 7: "5", 8: "b6", 9: "6", 10: "b7", 11: "7"};

        let currentRoot = "C";
        let currentScale = "Major (Ionian)";
        let currentOverlay = "all";
        const tuning = [4, 11, 7, 2, 9, 4];

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'es' : 'en';
            updateStaticText();
            updateUI();
        }

        function updateStaticText() {
            const t = translations[currentLang];
            document.getElementById("txt-title").textContent = t.title;
            document.getElementById("txt-subtitle").textContent = t.subtitle;
            document.getElementById("lang-btn-text").textContent = t.langBtn;
            document.getElementById("lbl-root").textContent = t.root;
            document.getElementById("lbl-scale").textContent = t.scale;
            document.getElementById("lbl-view").textContent = t.view;
            document.getElementById("opt-all").textContent = t.optAll;
            document.getElementById("opt-root").textContent = t.optRoot;
            document.getElementById("opt-penta").textContent = t.optPenta;
            document.getElementById("hdr-notes").textContent = t.hdrNotes;
            document.getElementById("hdr-intervals").textContent = t.hdrIntervals;
            document.getElementById("hdr-chords").textContent = t.hdrChords;
            document.getElementById("hdr-fretboard").textContent = t.hdrFretboard;
            document.getElementById("btn-play").textContent = t.btnPlay;
            document.getElementById("txt-disclaimer").textContent = t.disclaimer;
        }

        function init() {
            const rootContainer = document.getElementById("root-notes");
            notesSharp.forEach(note => {
                const btn = document.createElement("button");
                btn.textContent = note;
                btn.className = `px-2.5 py-1.5 rounded-lg font-mono text-xs font-bold transition-all transform hover:scale-105 active:scale-95 ${note === currentRoot ? 'bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/40 animate-glow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                btn.onclick = () => { currentRoot = note; updateUI(); };
                rootContainer.appendChild(btn);
            });

            const scaleSelect = document.getElementById("scale-select");
            Object.keys(scales).forEach(scaleName => {
                const opt = document.createElement("option");
                opt.value = scaleName;
                opt.textContent = scaleName;
                scaleSelect.appendChild(opt);
            });
            scaleSelect.onchange = (e) => { currentScale = e.target.value; updateUI(); };
            document.getElementById("overlay-select").onchange = (e) => { currentOverlay = e.target.value; updateUI(); };

            updateUI();
        }

        function updateUI() {
            document.querySelectorAll("#root-notes button").forEach(btn => {
                btn.className = btn.textContent === currentRoot 
                    ? "px-2.5 py-1.5 rounded-lg font-mono text-xs font-bold bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/40 animate-glow transition-all transform scale-105" 
                    : "px-2.5 py-1.5 rounded-lg font-mono text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all";
            });

            const rootIndex = notesSharp.indexOf(currentRoot);
            const scaleData = scales[currentScale];
            const scaleNotes = scaleData.intervals.map(iv => notesSharp[(rootIndex + iv) % 12]);
            
            document.getElementById("scale-notes").innerHTML = scaleNotes.map(n => `<span class="px-3 py-1 bg-slate-800/80 border border-slate-700 rounded-lg text-cyan-300 shadow-sm">${n}</span>`).join("");
            document.getElementById("scale-intervals").innerHTML = scaleData.intervals.map((iv, i) => `<div class="bg-slate-800/80 px-2.5 py-1 rounded-md border border-slate-700">${scaleNotes[i]}: <span class="text-cyan-400">${intervalNames[iv]}</span></div>`).join("");

            const chordsContainer = document.getElementById("diatonic-chords");
            if (scaleData.chords.length > 0) {
                const roman = ["I", "II", "III", "IV", "V", "VI", "VII"];
                chordsContainer.innerHTML = scaleData.chords.map((chordType, i) => `<div class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 flex justify-between items-center"><span class="text-slate-400 text-xs font-bold">${roman[i]}</span> <span class="font-bold text-slate-100">${scaleNotes[i]} ${chordType}</span></div>`).join("");
            } else {
                chordsContainer.innerHTML = `<div class="text-slate-500 italic col-span-2">N/A</div>`;
            }

            renderFretboard(scaleNotes, rootIndex);
        }

        function renderFretboard(scaleNotes, rootIndex) {
            const fretboard = document.getElementById("fretboard");
            fretboard.innerHTML = "";
            const stringNames = ["E", "B", "G", "D", "A", "E"];
            const numFrets = 15;

            tuning.forEach((stringBaseNote, stringIdx) => {
                const stringRow = document.createElement("div");
                stringRow.className = "flex items-center space-x-1";

                const label = document.createElement("div");
                label.textContent = stringNames[stringIdx];
                label.className = "w-6 text-center font-bold text-xs text-slate-400";
                stringRow.appendChild(label);

                for (let fret = 0; fret <= numFrets; fret++) {
                    const noteIdx = (stringBaseNote + fret) % 12;
                    const noteName = notesSharp[noteIdx];
                    const isRoot = noteIdx === rootIndex;
                    const isInScale = scaleNotes.includes(noteName);

                    let showNote = false;
                    if (currentOverlay === 'all' && isInScale) showNote = true;
                    if (currentOverlay === 'root' && isRoot) showNote = true;
                    if (currentOverlay === 'pentatonic' && isInScale && fret >= 3 && fret <= 12) showNote = true;
                    if (fret === 0 && isInScale) showNote = true;

                    const fretEl = document.createElement("div");
                    fretEl.className = `flex-1 h-9 flex items-center justify-center text-xs font-mono rounded-md border transition-all relative ${
                        isRoot ? 'bg-cyan-500 text-slate-950 font-black shadow-md shadow-cyan-500/30 border-cyan-400 scale-105 z-10' :
                        showNote ? 'bg-slate-800 text-cyan-300 border-slate-700 font-semibold shadow-sm' :
                        'bg-slate-950/40 text-slate-700 border-slate-800/40'
                    }`;
                    fretEl.textContent = (showNote || fret === 0) ? noteName : "";
                    stringRow.appendChild(fretEl);
                }
                fretboard.appendChild(stringRow);
            });
        }

        function playScaleAudio() {
            if (!window.AudioContext && !window.webkitAudioContext) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const rootIndex = notesSharp.indexOf(currentRoot);
            const scaleData = scales[currentScale];
            const frequencies = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63]; // C3 base

            scaleData.intervals.forEach((iv, idx) => {
                setTimeout(() => {
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    const freq = 220 * Math.pow(2, ((rootIndex + iv) - 9) / 12);
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                }, idx * 250);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
